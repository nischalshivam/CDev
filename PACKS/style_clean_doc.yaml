name: clean_doc
display_name: "Clean Documentary"
version: "1.0"

description: "Clean, professional documentary style. Neutral color grading, clear typography, subtle motion."

color_grade:
  type: "subtle"
  saturation: 1.0
  contrast: 1.02
  brightness: 1.0

typography:
  title_font: "Inter"
  body_font: "Inter"
  title_size: 48
  body_size: 24
  color: "#FFFFFF"
  shadow: true
  shadow_color: "#000000"
  shadow_blur: 3

transitions:
  default: "dissolve"
  duration: 0.5

motion:
  default: "slow_push_in"
  duration: 8.0
  intensity: "subtle"

audio:
  music_style: "ambient_documentary"
  music_volume: -25
  sfx_enabled: true
  sfx_volume: -20
